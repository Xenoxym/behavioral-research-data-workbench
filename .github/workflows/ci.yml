name: Verify research workbench
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q --junitxml=artifacts/junit.xml
      - run: uv run research-workbench demo
      - run: uv run research-workbench evaluate
      - run: uv run research-workbench report
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: |
            artifacts/junit.xml
            reports/quality/
            reports/study_report.*
