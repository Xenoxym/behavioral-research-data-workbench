name: Verify research workbench
on:
  push:
    paths-ignore: ['**.md', 'reports/**', 'docs/screenshots/**']
  pull_request:
    paths-ignore: ['**.md', 'reports/**', 'docs/screenshots/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        if: runner.os != 'Windows'
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install authoritative survey engine
        if: runner.os != 'Windows'
        shell: Rscript {0}
        run: install.packages(c('survey', 'jsonlite'), repos='https://cloud.r-project.org')
      - name: Validate project-local Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup_research_r.ps1
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q --junitxml=artifacts/junit.xml
        env:
          LC_ALL: C
          LANG: C
      - run: uv run research-workbench demo
      - run: uv run research-workbench evaluate
      - run: uv run research-workbench report
      - name: Install browser for real research acceptance
        if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - name: Exercise saved real research in Chromium
        if: runner.os == 'Linux'
        run: uv run python scripts/research_browser_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}
          path: |
            artifacts/junit.xml
            reports/quality/
            reports/study_report.*
            artifacts/research_browser/
