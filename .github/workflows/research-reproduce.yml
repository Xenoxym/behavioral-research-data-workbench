name: Reproduce real CDC research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-data:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      LC_ALL: C
      LANG: C
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - name: Install R survey
        shell: Rscript {0}
        run: install.packages(c('survey', 'jsonlite'), repos='https://cloud.r-project.org')
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev
      - run: uv run research-workbench research
      - run: uv run python scripts/compare_research_release.py
      - run: uv run python scripts/verify_research_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-research-results
          path: |
            reports/research/
            reports/RESEARCH_REPORT.*
