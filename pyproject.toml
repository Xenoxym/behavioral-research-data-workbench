[project]
name = "behavioral-research-data-workbench"
version = "0.1.0"
description = "Reproducible behavioral research operations and data quality workbench"
requires-python = ">=3.12,<3.14"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "streamlit>=1.40,<2", "plotly>=5.24,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[project.scripts]
research-workbench = "study_workbench.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["study_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
